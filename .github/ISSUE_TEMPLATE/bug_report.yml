name: 🐛 Bug report
description: Something in Soundpost isn't working as expected.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Soundpost! Please fill this out so we can reproduce the issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I plugged in my Bluetooth headset and audio kept playing on the speakers...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: input
    id: soundpost-version
    attributes:
      label: Soundpost version / commit
      placeholder: "0.1.0 or main@abc1234"
  - type: textarea
    id: devices
    attributes:
      label: Audio devices & apps involved
      description: Which outputs/inputs/apps? Bluetooth, HDMI, USB, virtual devices?
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Attach logs from %AppData%\Soundpost\logs if available.
      render: text
