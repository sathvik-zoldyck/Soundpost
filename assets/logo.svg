<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soundpost logo">
  <defs>
    <linearGradient id="sp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.5" stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#a24bff"/>
    </linearGradient>
  </defs>

  <!-- left equalizer bars (warm) -->
  <g fill="#ff7a1a">
    <rect x="60"  y="206" width="18" height="100" rx="9"/>
    <rect x="96"  y="181" width="18" height="150" rx="9"/>
    <rect x="132" y="161" width="18" height="190" rx="9"/>
  </g>

  <!-- right equalizer bars (violet) -->
  <g fill="#a24bff">
    <rect x="362" y="161" width="18" height="190" rx="9"/>
    <rect x="398" y="181" width="18" height="150" rx="9"/>
    <rect x="434" y="206" width="18" height="100" rx="9"/>
  </g>

  <!-- interlocking S -->
  <path d="M 336 176 C 296 148, 212 158, 212 202 C 212 236, 256 248, 256 256 C 256 264, 300 276, 300 310 C 300 354, 216 364, 176 336"
        stroke="url(#sp-grad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
